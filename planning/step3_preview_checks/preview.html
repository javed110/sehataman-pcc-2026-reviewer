&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;

  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||

    );

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      modelContent: null,
      privateContent: null,
      ...parsedState,

        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,

      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

        new TypeError(&quot;Visualization state does not support image attachments&quot;),

    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {

      }),
    );

      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);

        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

        return;
      }

      });
      return;
    }

    openExternal({ href });
  });

  syncTheme();
})();

&lt;/style&gt;
&lt;script&gt;
(()=&gt;{
  const root=document.getElementById(&#x27;vhg-design&#x27;);
  const content=root.querySelector(&#x27;#vhg-content&#x27;);
  const nav=root.querySelector(&#x27;#vhg-navigation&#x27;);
  const account=root.querySelector(&#x27;#vhg-account&#x27;);
  const feedback=root.querySelector(&#x27;#vhg-feedback&#x27;);
  const menus={patient:[[&#x27;history&#x27;,&#x27;Diagnostic history&#x27;],[&#x27;report&#x27;,&#x27;Report &amp; versions&#x27;],[&#x27;directory&#x27;,&#x27;Find physician&#x27;],[&#x27;sharing&#x27;,&#x27;My sharing&#x27;],[&#x27;consent&#x27;,&#x27;Review sharing&#x27;],[&#x27;identity&#x27;,&#x27;Identity status&#x27;]],lab:[[&#x27;submit&#x27;,&#x27;Submit report&#x27;],[&#x27;review&#x27;,&#x27;Review queue&#x27;],[&#x27;versions&#x27;,&#x27;Amendment history&#x27;]],hospital:[[&#x27;profiles&#x27;,&#x27;Physician profiles&#x27;],[&#x27;affiliation&#x27;,&#x27;Affiliation status&#x27;]],physician:[[&#x27;appointments&#x27;,&#x27;My appointments&#x27;],[&#x27;reader&#x27;,&#x27;Report reader&#x27;]],signin:[]};
  const names={patient:&#x27;Demo Patient P01 · Test CNIC ending 0010&#x27;,lab:&#x27;Demo Lab L01 · authorized staff&#x27;,hospital:&#x27;Demo Hospital H01 · profile manager&#x27;,physician:&#x27;Demo Physician D01&#x27;,signin:&#x27;Secure account access&#x27;};
  let state={persona:&#x27;patient&#x27;,screen:&#x27;history&#x27;,v1:true,v2:false,affiliation:true,booked:true,reportVersion:2};
  const badge=(text,kind=&#x27;&#x27;)=&gt;`&lt;span class=&quot;vhg-badge ${kind}&quot;&gt;${text}&lt;/span&gt;`;
  const action=(name,label,cls=&#x27;&#x27;)=&gt;`&lt;button type=&quot;button&quot; data-action=&quot;${name}&quot; class=&quot;${cls}&quot;&gt;${label}&lt;/button&gt;`;
  const intro=(title,text)=&gt;`&lt;h1&gt;${title}&lt;/h1&gt;&lt;p class=&quot;vhg-intro&quot;&gt;${text}&lt;/p&gt;`;
  const metadata=(items)=&gt;`&lt;dl class=&quot;vhg-meta&quot;&gt;${items.map(([k,v])=&gt;`&lt;div&gt;&lt;dt&gt;${k}&lt;/dt&gt;&lt;dd&gt;${v}&lt;/dd&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/dl&gt;`;
  const credentialStrip=()=&gt;`&lt;div class=&quot;vhg-row&quot;&gt;${badge(&#x27;Registration · simulated valid&#x27;,&#x27;vhg-ok&#x27;)}${badge(&#x27;Hospital affiliation · &#x27;+(state.affiliation?&#x27;simulated valid&#x27;:&#x27;revoked&#x27;),state.affiliation?&#x27;vhg-ok&#x27;:&#x27;vhg-stop&#x27;)}&lt;/div&gt;`;
  const lineage=()=&gt;`&lt;div class=&quot;vhg-version&quot;&gt;&lt;strong&gt;Version 2 · current&lt;/strong&gt;&lt;p class=&quot;vhg-caption&quot;&gt;21 Oct, 09:15 PKT · Lab Approver L01-A02&lt;/p&gt;&lt;p&gt;Correction: synthetic result entry amended.&lt;/p&gt;${badge(&#x27;New version requires separate sharing&#x27;,&#x27;vhg-warn&#x27;)}&lt;/div&gt;&lt;div class=&quot;vhg-version&quot;&gt;&lt;strong&gt;Version 1 · superseded&lt;/strong&gt;&lt;p class=&quot;vhg-caption&quot;&gt;20 Oct, 14:10 PKT · original preserved&lt;/p&gt;&lt;p class=&quot;vhg-caption&quot;&gt;Predecessor retained with issuer evidence.&lt;/p&gt;&lt;/div&gt;`;
  function history(){return intro(&#x27;Your diagnostic history&#x27;,&#x27;Reports supplied by your demo laboratories. This history contains diagnostic reports only.&#x27;)+`&lt;div class=&quot;vhg-topline&quot;&gt;&lt;div&gt;${badge(&#x27;Identity · simulated verified&#x27;,&#x27;vhg-ok&#x27;)} &lt;span class=&quot;vhg-caption&quot;&gt;Test CNIC ending 0010&lt;/span&gt;&lt;/div&gt;${action(&#x27;directory&#x27;,&#x27;Find a physician&#x27;,&#x27;vhg-primary&#x27;)}&lt;/div&gt;&lt;section class=&quot;vhg-panel&quot;&gt;&lt;div class=&quot;vhg-entry&quot;&gt;&lt;div class=&quot;vhg-date&quot;&gt;OCT&lt;strong&gt;21&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;Respiratory PCR · R01&lt;/h3&gt;&lt;p class=&quot;vhg-caption&quot;&gt;Demo Molecular Lab L01 · specimen S01&lt;/p&gt;${badge(&#x27;Version 2 · corrected&#x27;,&#x27;vhg-warn&#x27;)} &lt;span class=&quot;vhg-caption&quot;&gt;${state.v2?&#x27;Shared with D01&#x27;:&#x27;New version not shared&#x27;}&lt;/span&gt;&lt;/div&gt;${action(&#x27;report&#x27;,&#x27;View report&#x27;)}&lt;/div&gt;&lt;div class=&quot;vhg-entry&quot;&gt;&lt;div class=&quot;vhg-date&quot;&gt;OCT&lt;strong&gt;19&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;Respiratory PCR · R02&lt;/h3&gt;&lt;p class=&quot;vhg-caption&quot;&gt;Demo Molecular Lab L02 · specimen S02&lt;/p&gt;${badge(&#x27;Version 1 · current&#x27;)} &lt;span class=&quot;vhg-caption&quot;&gt;Not shared&lt;/span&gt;&lt;/div&gt;${action(&#x27;r02&#x27;,&#x27;View report&#x27;)}&lt;/div&gt;&lt;/section&gt;&lt;p class=&quot;vhg-caption&quot;&gt;Only your accepted reports appear here. A report under identity review is withheld from this history.&lt;/p&gt;`;}
  function report(){const v=state.reportVersion;return intro(&#x27;Respiratory PCR · R01&#x27;,&#x27;Demo Patient P01 · source report L01-R01&#x27;)+`&lt;div class=&quot;vhg-topline&quot;&gt;&lt;div&gt;${badge(v===2?&#x27;Version 2 · current&#x27;:&#x27;Version 1 · superseded&#x27;,v===2?&#x27;&#x27;:&#x27;vhg-warn&#x27;)}&lt;/div&gt;&lt;label class=&quot;vhg-field&quot; style=&quot;max-width:230px&quot;&gt;Report version&lt;select id=&quot;vhg-version&quot;&gt;&lt;option value=&quot;2&quot; ${v===2?&#x27;selected&#x27;:&#x27;&#x27;}&gt;Version 2 · current&lt;/option&gt;&lt;option value=&quot;1&quot; ${v===1?&#x27;selected&#x27;:&#x27;&#x27;}&gt;Version 1 · superseded&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;vhg-grid&quot;&gt;&lt;section class=&quot;vhg-panel&quot;&gt;&lt;span class=&quot;vhg-label&quot;&gt;Invented target X&lt;/span&gt;&lt;div class=&quot;vhg-result&quot;&gt;${v===2?&#x27;Detected&#x27;:&#x27;Not detected&#x27;}&lt;/div&gt;&lt;p class=&quot;vhg-caption&quot;&gt;Synthetic result · no clinical interpretation&lt;/p&gt;&lt;hr class=&quot;vhg-separator&quot;&gt;${badge(&#x27;Issuer evidence · simulated intact&#x27;,&#x27;vhg-ok&#x27;)}${metadata([[&#x27;Issuing laboratory&#x27;,&#x27;Demo Molecular Lab L01&#x27;],[&#x27;Specimen / order&#x27;,&#x27;S01 · O01&#x27;],[&#x27;Specimen context&#x27;,&#x27;Invented respiratory swab&#x27;],[&#x27;Method&#x27;,&#x27;Demo qualitative PCR&#x27;],[&#x27;Issued&#x27;,v===2?&#x27;21 Oct 2026, 09:15 PKT&#x27;:&#x27;20 Oct 2026, 14:10 PKT&#x27;],[&#x27;Received&#x27;,v===2?&#x27;21 Oct 2026, 09:16 PKT&#x27;:&#x27;20 Oct 2026, 14:11 PKT&#x27;],[&#x27;Source approval&#x27;,&#x27;L01-A02 · distinct approver&#x27;],[&#x27;Predecessor&#x27;,v===2?&#x27;R01 · version 1&#x27;:&#x27;Original version&#x27;]])}&lt;div class=&quot;vhg-actions&quot;&gt;${action(&#x27;file&#x27;,&#x27;View protected file&#x27;)}${action(&#x27;consent&#x27;,&#x27;Review sharing&#x27;,&#x27;vhg-primary&#x27;)}&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;vhg-panel&quot;&gt;&lt;h2&gt;Preserved version history&lt;/h2&gt;${lineage()}&lt;/section&gt;&lt;/div&gt;`;}
  function directory(){return intro(&#x27;Find a physician&#x27;,&#x27;Profiles supplied by Demo Hospital H01. Registration and hospital affiliation are checked separately.&#x27;)+`&lt;div class=&quot;vhg-filter&quot;&gt;&lt;label class=&quot;vhg-field&quot;&gt;Specialty&lt;select id=&quot;vhg-specialty&quot;&gt;&lt;option&gt;All specialties&lt;/option&gt;&lt;option&gt;Internal medicine&lt;/option&gt;&lt;option&gt;Pulmonology&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;vhg-field&quot;&gt;Language&lt;select id=&quot;vhg-language&quot;&gt;&lt;option&gt;Any language&lt;/option&gt;&lt;option&gt;Urdu&lt;/option&gt;&lt;option&gt;English&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;div class=&quot;vhg-caption&quot;&gt;Demo City · fees in PKR&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;vhg-physicians&quot; id=&quot;vhg-doctor-list&quot;&gt;&lt;/div&gt;&lt;div class=&quot;vhg-banner&quot; style=&quot;margin-top:16px&quot;&gt;Booking an appointment does not share your reports. You choose records in a separate confirmation.&lt;/div&gt;`;}
  const doctors=[{id:&#x27;D01&#x27;,specialty:&#x27;Internal medicine&#x27;,languages:[&#x27;Urdu&#x27;,&#x27;English&#x27;],fee:&#x27;1,500&#x27;,reg:true,aff:true},{id:&#x27;D02&#x27;,specialty:&#x27;Pulmonology&#x27;,languages:[&#x27;Urdu&#x27;],fee:&#x27;1,800&#x27;,reg:true,aff:false},{id:&#x27;D03&#x27;,specialty:&#x27;Internal medicine&#x27;,languages:[&#x27;English&#x27;],fee:&#x27;1,600&#x27;,reg:false,aff:true}];
  function doctorList(){const target=root.querySelector(&#x27;#vhg-doctor-list&#x27;);if(!target)return;const specialty=root.querySelector(&#x27;#vhg-specialty&#x27;).value;const language=root.querySelector(&#x27;#vhg-language&#x27;).value;const filtered=doctors.filter(d=&gt;(specialty===&#x27;All specialties&#x27;||d.specialty===specialty)&amp;&amp;(language===&#x27;Any language&#x27;||d.languages.includes(language)));target.innerHTML=filtered.map(d=&gt;{const aff=d.id===&#x27;D01&#x27;?state.affiliation:d.aff;const eligible=d.reg&amp;&amp;aff;return `&lt;section class=&quot;vhg-panel&quot;&gt;&lt;div class=&quot;vhg-avatar&quot;&gt;${d.id}&lt;/div&gt;&lt;h2&gt;Demo Physician ${d.id}&lt;/h2&gt;&lt;p class=&quot;vhg-person-meta&quot;&gt;${d.specialty}&lt;br&gt;${d.languages.join(&#x27; · &#x27;)} · Demo City&lt;br&gt;PKR ${d.fee} · synthetic fee&lt;/p&gt;${badge(&#x27;Registration · &#x27;+(d.reg?&#x27;simulated valid&#x27;:&#x27;pending&#x27;),d.reg?&#x27;vhg-ok&#x27;:&#x27;vhg-warn&#x27;)}${badge(&#x27;Affiliation · &#x27;+(aff?&#x27;simulated valid&#x27;:d.id===&#x27;D01&#x27;?&#x27;revoked&#x27;:&#x27;pending&#x27;),aff?&#x27;vhg-ok&#x27;:d.id===&#x27;D01&#x27;?&#x27;vhg-stop&#x27;:&#x27;vhg-warn&#x27;)}&lt;p class=&quot;vhg-caption&quot; style=&quot;margin-top:10px&quot;&gt;${eligible?&#x27;Slot: 21 Oct, 10:30 PKT&#x27;:&#x27;Booking unavailable until both checks pass&#x27;}&lt;/p&gt;&lt;button type=&quot;button&quot; data-action=&quot;book&quot; class=&quot;vhg-primary&quot; ${eligible?&#x27;&#x27;:&#x27;disabled&#x27;}&gt;${state.booked&amp;&amp;d.id===&#x27;D01&#x27;?&#x27;Appointment details&#x27;:&#x27;Book appointment&#x27;}&lt;/button&gt;&lt;/section&gt;`;}).join(&#x27;&#x27;)||&#x27;&lt;p&gt;No profiles match these filters.&lt;/p&gt;&#x27;;}
  function sharing(){return intro(&#x27;My sharing&#x27;,&#x27;Exact report versions, recipients and expiry are recorded for each permission.&#x27;)+`&lt;section class=&quot;vhg-panel&quot;&gt;&lt;div class=&quot;vhg-row&quot;&gt;&lt;div&gt;&lt;h2&gt;Demo Physician D01 · H01&lt;/h2&gt;&lt;p class=&quot;vhg-caption&quot;&gt;Appointment A01 · 21 Oct 2026, 10:30 PKT&lt;/p&gt;&lt;/div&gt;${badge(state.v1?&#x27;Version 1 grant · active&#x27;:&#x27;Version 1 grant · withdrawn&#x27;,state.v1?&#x27;vhg-ok&#x27;:&#x27;vhg-stop&#x27;)}&lt;/div&gt;${credentialStrip()}${metadata([[&#x27;Shared report&#x27;,&#x27;R01 · version 1 only&#x27;],[&#x27;Purpose&#x27;,&#x27;Consultation for appointment A01&#x27;],[&#x27;Access begins&#x27;,&#x27;21 Oct, 10:00 PKT · inclusive&#x27;],[&#x27;Access ends&#x27;,&#x27;21 Oct, 11:30 PKT · exclusive&#x27;]])}&lt;div class=&quot;vhg-actions&quot;&gt;${state.v1?action(&#x27;withdraw&#x27;,&#x27;Withdraw version 1 sharing&#x27;,&#x27;vhg-danger&#x27;):&#x27;&#x27;}${action(&#x27;consent&#x27;,state.v2?&#x27;Review corrected-version sharing&#x27;:&#x27;Share corrected version 2&#x27;,&#x27;vhg-primary&#x27;)}&lt;/div&gt;${state.v2?`&lt;hr class=&quot;vhg-separator&quot;&gt;&lt;div class=&quot;vhg-row&quot;&gt;&lt;span&gt;Separate active grant · R01 version 2&lt;/span&gt;${action(&#x27;withdrawV2&#x27;,&#x27;Withdraw version 2&#x27;,&#x27;vhg-danger&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}&lt;/section&gt;&lt;section class=&quot;vhg-panel&quot;&gt;&lt;h2&gt;Your access history&lt;/h2&gt;&lt;ul class=&quot;vhg-list&quot;&gt;&lt;li&gt;Demo Lab L01 issued R01 version 2&lt;small&gt;21 Oct, 09:15 PKT · correction; original preserved&lt;/small&gt;&lt;/li&gt;&lt;li&gt;You authorized D01 to view R01 version 1&lt;small&gt;21 Oct, 09:30 PKT · appointment A01&lt;/small&gt;&lt;/li&gt;&lt;li&gt;D01 report delivery event · version 1&lt;small&gt;21 Oct, 10:00 PKT · illustrative history; delivery does not prove reading&lt;/small&gt;&lt;/li&gt;${!state.v1?&#x27;&lt;li&gt;You withdrew version 1 sharing&lt;small&gt;Preview event · next request must be rechecked&lt;/small&gt;&lt;/li&gt;&#x27;:&#x27;&#x27;}&lt;/ul&gt;&lt;/section&gt;&lt;p class=&quot;vhg-caption&quot;&gt;Withdrawal blocks future authorized requests after it is saved. Previously delivered copies cannot be recalled.&lt;/p&gt;`;}
  function consent(){return intro(&#x27;Review record sharing&#x27;,&#x27;Choose the exact version you want to share. No report is selected automatically.&#x27;)+`&lt;div class=&quot;vhg-grid&quot;&gt;&lt;section class=&quot;vhg-panel&quot;&gt;&lt;span class=&quot;vhg-label&quot;&gt;Recipient&lt;/span&gt;&lt;h2&gt;Demo Physician D01&lt;/h2&gt;&lt;p class=&quot;vhg-caption&quot;&gt;Demo Hospital H01 · Internal medicine&lt;/p&gt;${credentialStrip()}&lt;hr class=&quot;vhg-separator&quot;&gt;&lt;span class=&quot;vhg-label&quot;&gt;Select records&lt;/span&gt;&lt;label class=&quot;vhg-check&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;vhg-select-v2&quot;&gt;&lt;span&gt;&lt;strong&gt;R01 · version 2 · corrected&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;vhg-caption&quot;&gt;Demo Molecular Lab L01 · 21 Oct 2026&lt;/span&gt;&lt;/span&gt;&lt;/label&gt;&lt;p class=&quot;vhg-caption&quot;&gt;Future corrections will need a separate permission.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;vhg-panel&quot;&gt;&lt;h2&gt;Permission details&lt;/h2&gt;${metadata([[&#x27;Appointment&#x27;,&#x27;A01 · 21 Oct, 10:30 PKT&#x27;],[&#x27;Purpose&#x27;,&#x27;Consultation&#x27;],[&#x27;Begins&#x27;,&#x27;21 Oct, 10:00 PKT · inclusive&#x27;],[&#x27;Ends&#x27;,&#x27;21 Oct, 11:30 PKT · exclusive&#x27;]])}&lt;label class=&quot;vhg-check&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;vhg-ack&quot;&gt;&lt;span&gt;I authorize this physician to access only the selected version for this appointment and time.&lt;/span&gt;&lt;/label&gt;&lt;div class=&quot;vhg-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;vhg-primary&quot; data-action=&quot;confirm&quot; id=&quot;vhg-confirm&quot; disabled&gt;Confirm selected sharing&lt;/button&gt;${action(&#x27;sharing&#x27;,&#x27;Cancel&#x27;)}&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;`;}
  function submit(){return intro(&#x27;Submit a diagnostic report&#x27;,&#x27;Demo Molecular Lab L01 · submitter L01-S01&#x27;)+`&lt;div class=&quot;vhg-grid&quot;&gt;&lt;section class=&quot;vhg-panel&quot;&gt;&lt;h2&gt;Patient and specimen linkage&lt;/h2&gt;&lt;div class=&quot;vhg-filter&quot;&gt;&lt;label class=&quot;vhg-field&quot;&gt;Synthetic CNIC fixture&lt;input value=&quot;TEST-CNIC-P01&quot; readonly&gt;&lt;/label&gt;&lt;label class=&quot;vhg-field&quot;&gt;Secondary demographic check&lt;input value=&quot;Demo Patient P01 · adult fixture&quot; readonly&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;vhg-filter&quot;&gt;&lt;label class=&quot;vhg-field&quot;&gt;Order&lt;input value=&quot;O01&quot; readonly&gt;&lt;/label&gt;&lt;label class=&quot;vhg-field&quot;&gt;Specimen&lt;input value=&quot;S01 · respiratory swab&quot; readonly&gt;&lt;/label&gt;&lt;/div&gt;&lt;label class=&quot;vhg-field&quot;&gt;Submission scenario&lt;select id=&quot;vhg-case&quot;&gt;&lt;option value=&quot;mismatch&quot;&gt;CNIC / specimen mismatch&lt;/option&gt;&lt;option value=&quot;valid&quot;&gt;Concordant signed submission&lt;/option&gt;&lt;option value=&quot;tampered&quot;&gt;Altered file / issuer evidence failure&lt;/option&gt;&lt;option value=&quot;replay&quot;&gt;Duplicate source message&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;div class=&quot;vhg-actions&quot;&gt;${action(&#x27;validate&#x27;,&#x27;Submit for validation&#x27;,&#x27;vhg-primary&#x27;)}&lt;/div&gt;&lt;div id=&quot;vhg-validation-result&quot; aria-live=&quot;polite&quot; style=&quot;margin-top:16px&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;vhg-panel&quot;&gt;&lt;h2&gt;Source package&lt;/h2&gt;&lt;ul class=&quot;vhg-list&quot;&gt;&lt;li&gt;Report R01 · source L01-R01&lt;small&gt;Issuer fixed to authenticated laboratory&lt;/small&gt;&lt;/li&gt;&lt;li&gt;Order, specimen and test context&lt;small&gt;Checked against independent enrolment&lt;/small&gt;&lt;/li&gt;&lt;li&gt;Content digest + signed manifest&lt;small&gt;Includes version, predecessor and approval reference&lt;/small&gt;&lt;/li&gt;&lt;li&gt;Distinct approver required&lt;small&gt;Submission does not publish a clinical result&lt;/small&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;&lt;/div&gt;`;}
  function review(){return intro(&#x27;Submission review queue&#x27;,&#x27;Demo Molecular Lab L01 · approver L01-A02 · distinct from submitter L01-S01&#x27;)+`&lt;section class=&quot;vhg-panel&quot;&gt;&lt;div class=&quot;vhg-topline&quot;&gt;&lt;div&gt;&lt;h2&gt;Submission SUB-01 · R01&lt;/h2&gt;&lt;p class=&quot;vhg-caption&quot;&gt;Test CNIC ending 0010 · O01 · S01&lt;/p&gt;&lt;/div&gt;${badge(&#x27;Held · identity/specimen mismatch&#x27;,&#x27;vhg-stop&#x27;)}&lt;/div&gt;&lt;ul class=&quot;vhg-list&quot;&gt;&lt;li&gt;Source organization and submitter&lt;small&gt;Simulated approved laboratory L01&lt;/small&gt;&lt;/li&gt;&lt;li&gt;Issuer evidence and content&lt;small&gt;Intact synthetic signed package&lt;/small&gt;&lt;/li&gt;&lt;li&gt;CNIC / specimen mapping&lt;small&gt;Does not match the enrolled order linkage&lt;/small&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;vhg-banner vhg-stop&quot; style=&quot;margin-top:16px&quot;&gt;Cannot approve. Correct the source association and resubmit for full validation.&lt;/div&gt;&lt;div class=&quot;vhg-actions&quot;&gt;&lt;button type=&quot;button&quot; disabled&gt;Approve report&lt;/button&gt;${action(&#x27;returnSubmission&#x27;,&#x27;Return for correction&#x27;)}&lt;/div&gt;&lt;/section&gt;&lt;p class=&quot;vhg-caption&quot;&gt;Held submissions are absent from accepted patient histories. An approver cannot override failed identity or integrity checks.&lt;/p&gt;`;}
  function versions(){return intro(&#x27;Amendment history · R01&#x27;,&#x27;Demo Molecular Lab L01 · accepted content is preserved.&#x27;)+`&lt;div class=&quot;vhg-grid&quot;&gt;&lt;section class=&quot;vhg-panel&quot;&gt;&lt;h2&gt;Linked versions&lt;/h2&gt;${lineage()}&lt;/section&gt;&lt;section class=&quot;vhg-panel&quot;&gt;&lt;h2&gt;Propose an amendment&lt;/h2&gt;${metadata([[&#x27;Expected predecessor&#x27;,&#x27;R01 · version 2&#x27;],[&#x27;New source version&#x27;,&#x27;Version 3&#x27;],[&#x27;Submitter&#x27;,&#x27;L01-S01&#x27;],[&#x27;Approver&#x27;,&#x27;Different authorized account required&#x27;]])}&lt;label class=&quot;vhg-field&quot; style=&quot;margin-top:15px&quot;&gt;Correction reason&lt;textarea rows=&quot;2&quot; id=&quot;vhg-amend-reason&quot; placeholder=&quot;Describe the synthetic correction&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;div class=&quot;vhg-actions&quot;&gt;${action(&#x27;amend&#x27;,&#x27;Propose for approval&#x27;,&#x27;vhg-primary&#x27;)}&lt;/div&gt;&lt;p class=&quot;vhg-caption&quot; style=&quot;margin-top:12px&quot;&gt;A competing successor produces a conflict. This action never edits version 2 or extends a patient grant.&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;`;}

  function appointments(){const allowed=state.affiliation&amp;&amp;(state.v1||state.v2);return intro(&#x27;My appointments&#x27;,&#x27;Demo Physician D01 · minimum booking details only.&#x27;)+`&lt;section class=&quot;vhg-panel&quot;&gt;${credentialStrip()}&lt;hr class=&quot;vhg-separator&quot;&gt;&lt;div class=&quot;vhg-row&quot;&gt;&lt;div&gt;&lt;span class=&quot;vhg-label&quot;&gt;21 Oct · 10:30 PKT&lt;/span&gt;&lt;h2&gt;Demo Patient P01&lt;/h2&gt;&lt;p class=&quot;vhg-caption&quot;&gt;Appointment A01 · H01 · confirmed&lt;/p&gt;&lt;/div&gt;${badge(allowed?&#x27;Selected records shared&#x27;:&#x27;Record access unavailable&#x27;,allowed?&#x27;vhg-ok&#x27;:&#x27;vhg-warn&#x27;)}&lt;/div&gt;${allowed?`&lt;ul class=&quot;vhg-list&quot;&gt;${state.v1?&#x27;&lt;li&gt;R01 · version 1 · historical, superseded&lt;small&gt;Exact version authorized; valid until 11:30 PKT&lt;/small&gt;&lt;/li&gt;&#x27;:&#x27;&#x27;}${state.v2?&#x27;&lt;li&gt;R01 · version 2&lt;small&gt;Separately authorized; valid until 11:30 PKT&lt;/small&gt;&lt;/li&gt;&#x27;:&#x27;&#x27;}&lt;/ul&gt;`:&#x27;&lt;p&gt;No clinical content is released. Review eligibility or ask the patient to review sharing.&lt;/p&gt;&#x27;}&lt;div class=&quot;vhg-actions&quot;&gt;${action(&#x27;reader&#x27;,&#x27;Open authorized records&#x27;,&#x27;vhg-primary&#x27;)}&lt;/div&gt;&lt;/section&gt;&lt;p class=&quot;vhg-caption&quot;&gt;An appointment alone does not expose reports, result counts or full CNIC.&lt;/p&gt;`;}
  function reader(){const allowed=state.affiliation&amp;&amp;(state.v1||state.v2);if(!allowed)return intro(&#x27;Record access unavailable&#x27;,&#x27;Demo Physician D01 · appointment A01&#x27;)+`&lt;section class=&quot;vhg-panel&quot;&gt;&lt;div class=&quot;vhg-banner vhg-stop&quot;&gt;${!state.affiliation?&#x27;Hospital affiliation is no longer valid for this appointment.&#x27;:&#x27;No active patient permission covers this record.&#x27;}&lt;/div&gt;&lt;p&gt;The report and file are withheld. Your session does not preserve earlier access.&lt;/p&gt;${action(&#x27;appointments&#x27;,&#x27;Back to appointments&#x27;)}&lt;/section&gt;`;const version=state.v2?2:1;return intro(&#x27;Authorized report · R01&#x27;,`Demo Patient P01 · appointment A01 · exact version ${version}`)+`${version===1?&#x27;&lt;div class=&quot;vhg-banner vhg-warn&quot;&gt;Historical, superseded version. A newer version requires separate patient permission.&lt;/div&gt;&#x27;:&#x27;&#x27;}&lt;div class=&quot;vhg-grid&quot;&gt;&lt;section class=&quot;vhg-panel&quot;&gt;&lt;span class=&quot;vhg-label&quot;&gt;Invented target X&lt;/span&gt;&lt;div class=&quot;vhg-result&quot;&gt;${version===2?&#x27;Detected&#x27;:&#x27;Not detected&#x27;}&lt;/div&gt;&lt;p class=&quot;vhg-caption&quot;&gt;Synthetic result · no clinical interpretation&lt;/p&gt;${metadata([[&#x27;Issuer&#x27;,&#x27;Demo Molecular Lab L01&#x27;],[&#x27;Specimen / order&#x27;,&#x27;S01 · O01&#x27;],[&#x27;Version&#x27;,String(version)],[&#x27;Permission expires&#x27;,&#x27;21 Oct 2026, 11:30 PKT&#x27;]])}&lt;div class=&quot;vhg-actions&quot;&gt;${action(&#x27;file&#x27;,&#x27;View protected file&#x27;)}&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;vhg-panel&quot;&gt;&lt;h2&gt;Release conditions&lt;/h2&gt;&lt;ul class=&quot;vhg-list&quot;&gt;&lt;li&gt;Patient selected this exact version&lt;/li&gt;&lt;li&gt;Appointment and time window match&lt;/li&gt;&lt;li&gt;Independent registration is valid&lt;/li&gt;&lt;li&gt;Hospital affiliation is valid&lt;/li&gt;&lt;li&gt;Source integrity and audit are required&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;vhg-caption&quot; style=&quot;margin-top:12px&quot;&gt;These are proposed server checks. This screen preview does not enforce security.&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;`;}

  const screens={history,report,directory,sharing,consent,identity,submit,review,versions,profiles,affiliation,appointments,reader,signin};
  function normalize(incoming){const p=Object.hasOwn(menus,incoming?.persona)?incoming.persona:&#x27;patient&#x27;;const valid=menus[p].some(([id])=&gt;id===incoming?.screen);return {persona:p,screen:p===&#x27;signin&#x27;?&#x27;signin&#x27;:valid?incoming.screen:menus[p][0][0],v1:incoming?.v1!==false,v2:incoming?.v2===true,affiliation:incoming?.affiliation!==false,booked:true,reportVersion:incoming?.reportVersion===1?1:2};}

    const a=button.dataset.action;if(!a)return;

    else if(a===&#x27;signinPreview&#x27;)message(&#x27;Design only: credentials are not checked, submitted or stored. A server-verified session and second factor are required in Step 4.&#x27;);
